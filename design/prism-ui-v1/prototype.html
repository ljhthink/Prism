<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prism · 可点击原型</title>
<link rel="stylesheet" href="tokens.css">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: #0a0a09; color: #dcdcd2;
    font-family: var(--font); display: flex; align-items: center; justify-content: center;
    gap: 56px; padding: 40px; flex-wrap: wrap;
  }
  .side { width: 300px; }
  .side h1 { font-size: 20px; font-weight: 500; margin: 0 0 8px; letter-spacing: -0.2px; }
  .side p { font-size: 12px; line-height: 1.8; color: #868a7e; margin: 0 0 20px; }
  .side h2 { font-size: 11px; font-weight: 400; color: #6e7267; margin: 24px 0 8px; }
  .side ol { margin: 0; padding-left: 18px; font-size: 12px; line-height: 1.9; color: #a8ab9f; }
  .side code { font-family: var(--mono); font-size: 11px; color: #c9cabf; }
  .link { display: inline-block; margin-top: 20px; font-size: 12px; color: #e0a45c; text-decoration: none; border-bottom: 1px solid rgba(224,164,92,.35); padding-bottom: 2px; }
  .device { width: 402px; height: 856px; padding: 6px; border-radius: 38px; background: #050505; border: 1px solid #26261f; }
  .device iframe { width: 390px; height: 844px; border: 0; border-radius: 32px; display: block; background: #111210; }
  .themes { display: flex; gap: 4px; }
  .tm { padding: 6px 10px; border: 1px solid rgba(236,237,230,.12); background: transparent; color: #868a7e; font-size: 11px; border-radius: 999px; cursor: pointer; }
  .tm[aria-pressed="true"] { color: #111210; background: #ecede6; border-color: #ecede6; }
  @media (max-width: 820px) { body { padding: 24px 16px; gap: 24px; } .side { width: 100%; max-width: 402px; order: 2; } }
</style>
</head>
<body>
  <div class="side">
    <h1>Prism · 可点击原型</h1>
    <p>顶栏三个图标分别是语音通话、历史会话、新对话；设置六行可下钻；MCP / 技能右上角可新建；QQ 开启会拉起风险告知。</p>
    <h2>试试</h2>
    <ol>
      <li>顶栏麦克风 → 语音通话，底部可切换「流式 / 按住说话」</li>
      <li>顶栏历史图标 → 会话列表，右侧删除会带收起动画</li>
      <li>输入后「发送」变亮 → 运行态（阶段入场 / 工具卡 / 光标）→「停止」</li>
      <li>能力页点开关：过渡在本行完成，不整页跳</li>
      <li>设置 → 模型与密钥 → 切换端点 / 新建自定义</li>
    </ol>
    <h2>配色</h2>
    <div class="themes">
      <button class="tm" data-theme-btn="warm" aria-pressed="true">A 暖</button>
      <button class="tm" data-theme-btn="cool" aria-pressed="false">B 冷</button>
      <button class="tm" data-theme-btn="ink" aria-pressed="false">C 墨</button>
    </div>
    <a class="link" href="index.html">← 回到全部屏幕</a>
  </div>
  <div class="device"><iframe id="stage" title="Prism 原型" src="screen.html?screen=chat-run&theme=warm"></iframe></div>

<script>
  var theme = "warm";
  document.querySelectorAll("[data-theme-btn]").forEach(function (b) {
    b.addEventListener("click", function () {
      theme = b.getAttribute("data-theme-btn");
      document.querySelectorAll("[data-theme-btn]").forEach(function (x) {
        x.setAttribute("aria-pressed", String(x === b));
      });
      document.getElementById("stage").src = "screen.html?screen=chat-run&theme=" + theme;
    });
  });
</script>
</body>
</html>
