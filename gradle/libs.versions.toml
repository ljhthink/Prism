navigationCompose = "2.7.7"
objectbox = "5.4.2"
junit = "4.13.2"
tink = "1.15.0"
datastore = "1.1.1"
coroutines = "1.10.2"
lottie = "6.4.0"
ktor = "3.3.3"
kotlinxSerialization = "1.11.0"
kotlinxSerializationJson = "1.11.0"
mcp = "0.15.0"
documentfile = "1.0.1"
onnxruntime = "1.27.0"
poiOoxml = "5.5.1"
# R1（UXR10 真机修复）：桌面 PDFBox 3.0.8 依赖 java.awt（Android 无此包）→ 真机解析 PDF 崩溃。
# 生产切换为 pdfbox-android（com.tom-roush，Apache PDFBox 2.0.27 的 Android 官方移植，Apache 2.0，
# Maven Central，替换 java.awt 为 android.graphics）；桌面 pdfbox 仅 testImplementation 供测试夹具生成。
pdfbox = "3.0.8"
pdfboxAndroid = "2.0.27.0"
# R1：Robolectric 用于 JVM 单测加载 pdfbox-android（其依赖 android.graphics，纯 JVM 无法运行）
robolectric = "4.14.1"
# M4 Skills 系统（ADR-013 5.2）：SKILL.md frontmatter 解析
# 选型依据：charleskorn/kaml 已归档（2025-11-30），改用底层引擎 snakeyaml-engine-kmp
# 活跃维护（最后提交 2026-08-08），KMP 原生，Apache 2.0
snakeyamlEngineKmp = "4.0.1"
# UX-001 问题 3（Markdown 渲染）：Compose 原生 Markdown 渲染（ADR-021/022）
# 选型依据：mikepenz/multiplatform-markdown-renderer 活跃维护（最后提交 2026-08），
# Compose Multiplatform 原生，与 Material3 无缝集成，支持标题/列表/代码块/表格。
# UX-001 问题 1（ADR-022 二次修复）：0.15.0 流式渲染残留 #/-/| 符号 + 标题字号过大。
# 版本约束（2026-08-15 二次修复）：0.28.0 起字节码引用 Compose 1.7+ 的 Compiler/Runtime ABI
#（Composer.startReplaceGroup / TextLinkStyles），而项目 Compose BOM 2024.06.00 = Compose 1.6.8，
# 升级到 0.28+ 会在运行期抛 NoSuchMethodError / ClassNotFoundException（编译期通过、运行期崩）。
# 0.26.0 是兼容 Compose 1.6.8 的最高版本（无 1.7+ ABI 引用，含嵌套列表等渲染改进）。Apache 2.0
markdownRenderer = "0.26.0"
# US-1505（v1 批次15 A4）：Fetch 正文提纯换库（正则版保留为降级兜底）
# 坐标核实（2026-09-02）：Readability4J（Mozilla Readability.js 的 Kotlin 移植，Apache-2.0）
# 发布于 **Maven Central**：net.dankito.readability4j:readability4j:1.0.8（2021-10-26，最新版），
# 无需 jitpack。传递依赖：kotlin-stdlib 1.3.72（与项目 stdlib 冲突归并）/ slf4j-api 1.7.25
# （实际解析取 ktor 引入的 2.0.17，Android 无绑定走 NOP 静默路径）/ jsoup 1.11.2（被下方 1.18.3 归并）
readability4j = "1.0.8"
# jsoup（MIT，HTML5 解析器，零运行时依赖）。选型 1.18.3（2024-12）而非最新 1.23.2（2026-08-26 发布）：
# 宁稳勿新——1.23.x 引入 JDK HttpClient 多版本 jar（java.net.http 在 Android 不可用）且官方建议开启
# NIO desugaring；本项目未启用 desugaring。1.18.3 为纯 Java 8 字节码、Android 生态久经验证的稳定版；
# 其最高 API 要求 ThreadLocal.withInitial = API 26，恰等于项目 minSdk 26（无需 desugaring）。
jsoup = "1.18.3"

