# lychee 链接检查配置
# 依 CLAUDE.md 第五节 5.5

# 排除目录
exclude = [
  "node_modules",
  ".git",
  "tmp",
  ".trae",
  "build",
  ".gradle",
]

# 排除路径（文件系统）
exclude_path = [
  "node_modules",
  ".git",
  "tmp",
  "build",
  ".gradle",
]

# 超时（秒）
timeout = 20

# 最大重试
max_retries = 2

# 接受状态码
accept = [200, 206, 429]

# 用户代理
user_agent = "Mozilla/5.0 (compatible; lychee/Prism-doc-check)"

# 离线模式：仅检查本地文件链接（内部索引一致性），不检查外网 URL
# —— 存量报告含大量外网引用（429/403/防爬不可判定），外链有效性不作为门禁
offline = true
# 注：include/exclude 均按正则解析（非 glob）——文件范围由 workflow 的 args glob '**/*.md' 限定，
# 此前 include = ["**/*.md"] 被当作正则解析导致 "repetition operator missing expression" 启动失败。
