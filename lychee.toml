# lychee 链接检查配置
# 依 CLAUDE.md 第五节 5.5

# 排除目录
# exclude 按正则解析：
# - "app/src"：历史 PRD 含大量指向源码行号的锚点链接（目录/行号随重构漂移，不作为门禁）；
# - "reports/"：一次性报告工件（gitignore 不入库），链接目标在 CI 上必然缺失；
# 文档索引一致性由 scripts/consistency-check.js 覆盖（offline 模式下检查 README/AGENTS/PRD
# 之间的内部链接与 ADR 索引完整性）。
exclude = [
  "node_modules",
  ".git",
  "tmp",
  ".trae",
  "build",
  ".gradle",
  "app/src",
  "reports/",
]

# 排除路径（文件系统）
# - docs/decisions / docs/reports / docs/templates / docs/design / app：
#   历史 ADR/报告含大量指向「已重构源码路径」的锚点链接（目录迁移后腐烂），
#   不作为门禁；文档索引一致性由 scripts/consistency-check.js 覆盖（offline 模式下
#   仍检查 README/AGENTS/PRD 层的内部链接）
exclude_path = [
  "node_modules",
  ".git",
  "tmp",
  "build",
  ".gradle",
  "docs/decisions",
  "docs/reports",
  "docs/templates",
  "docs/design",
  "app",
  "gradle",
]

# 超时（秒）
timeout = 20

# 最大重试
max_retries = 2

# 接受状态码
accept = [200, 206, 429]

# 用户代理
user_agent = "Mozilla/5.0 (compatible; lychee/Prism-doc-check)"

# 离线模式：仅检查本地文件链接（内部索引一致性），不检查外网 URL
# —— 存量报告含大量外网引用（429/403/防爬不可判定），外链有效性不作为门禁
offline = true
# 注：include/exclude 均按正则解析（非 glob）——文件范围由 workflow 的 args glob '**/*.md' 限定，
# 此前 include = ["**/*.md"] 被当作正则解析导致 "repetition operator missing expression" 启动失败。
